[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["vite", "lightningcss", "@vitejs/devtools"]

[functions."*"]
  node_bundler = "esbuild"

# 1. Запити до API перенаправляємо на функцію
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# 2. Колбек від Discord також відправляємо у функцію!
[[redirects]]
  from = "/auth/callback"
  to = "/.netlify/functions/api/auth/callback"
  status = 200

# 3. Усі інші запити - у React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200