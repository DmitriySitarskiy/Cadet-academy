[build]
  command = "npm run build"
  publish = "dist"

# Redirect all API calls to server or functions (if using Netlify Functions)
# [[redirects]]
#   from = "/api/*"
#   to = "/.netlify/functions/api/:splat"
#   status = 200

# Single Page Application (SPA) routing for cadet and instructor links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
